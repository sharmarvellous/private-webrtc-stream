services:
  source-server:
    build:
      context: ./source-server
      dockerfile: Dockerfile
    container_name: private-stream-source-server
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_URL: http://localhost:5000
      ALLOWED_ORIGINS: http://localhost:5000,http://127.0.0.1:5000,http://localhost:5173,http://127.0.0.1:5173
      JWT_SECRET: change-me-in-development
      JWT_EXPIRES_IN: 8h
      SESSION_DEFAULT_TTL_MINUTES: 30
      SESSION_MAX_TTL_MINUTES: 120
      DATA_FILE: ./data/db.json
      SEED_FILE: ./data/seed.json
      LOG_LEVEL: debug
      STUN_URLS: stun:stun.l.google.com:19302
      TURN_URLS: ""
      TURN_USERNAME: ""
      TURN_CREDENTIAL: ""
      SOURCE_DASHBOARD_DIST: ./ui/dist
    volumes:
      - ./source-server:/app
      - /app/node_modules
    restart: unless-stopped

  viewer-client:
    build:
      context: ./viewer-client
      dockerfile: Dockerfile
    container_name: private-stream-viewer-client
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_SOURCE_SERVER_URL: http://localhost:5000
      VITE_APP_MODE: viewer
    volumes:
      - ./viewer-client:/app
      - /app/node_modules
    depends_on:
      - source-server
    restart: unless-stopped
